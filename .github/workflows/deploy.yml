name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nx affected needs history to diff against

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci hard-fails on an EBADPLATFORM check for an optional esbuild
      # platform binary that it should just skip; npm install tolerates it.
      - run: npm install

      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint,test,build --parallel=3

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Explicit, not affected-gated: with one function project, gating deploy
      # behind `nx affected` risks a silent no-op on infra-only changes.
      # Once Phase 4 adds shared libs, switch to `nx affected -t deploy`.
      - run: npx nx deploy api
