name: pages

# Publishes apps/site (plain HTML, no build) to GitHub Pages. As a project site
# under the Bmgaynor.github.io user site, it's served at
# https://bradgaynor.com/bivy-app/ with no CNAME of its own.
on:
  push:
    branches: [main]
    paths: ["apps/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site

      - id: deployment
        uses: actions/deploy-pages@v4
